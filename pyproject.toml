[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "planjud-calculo"
version = "2.0.0"
description = "MCP offline para extrair demonstrativos de pagamentos e calcular correção monetária localmente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rogério Nogueira", email = "roger@uft.edu.br" }]
keywords = [
  "mcp",
  "pdf",
  "pymupdf",
  "planjud",
  "correcao-monetaria",
  "inpc",
  "ipca",
  "excel",
]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/rogernogueira/planjud"
Repository = "https://github.com/rogernogueira/planjud"

[project.scripts]
planjud-mcp = "demonstrativo_mcp.server:main"
demonstrativo-pagamentos-mcp = "demonstrativo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/demonstrativo_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
