[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planjud-calculo"
version = "1.0.0"
description = "Correção monetária e juros de mora pelo Planjud / Cálculo Geral (TJTO) — CLI + servidor MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rogério Nogueira", email = "roger@uft.edu.br" }]
keywords = ["planjud", "tjto", "calculo", "correcao-monetaria", "inpc", "ipca", "selic", "mcp"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
mcp = ["mcp<2"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/rogernogueira/planjud"

[project.scripts]
planjud-calc = "planjud_calc:main"
planjud-mcp = "planjud_mcp:main"

[tool.setuptools]
py-modules = ["planjud_calc", "planjud_mcp"]
package-dir = { "" = "scripts" }
